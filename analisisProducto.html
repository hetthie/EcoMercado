<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análisis del Producto</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }

        .analysis-header {
            text-align: center;
            padding: 20px 0;
            font-size: 28px;
            font-weight: 700;
            color: white;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .image-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            flex: 1;
        }

        #capturedImage {
            max-width: 100%;
            max-height: 50vh;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 3px solid rgba(255, 255, 255, 0.3);
        }

        .result-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            margin: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .result-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .result-text {
            font-size: 22px;
            font-weight: 600;
            color: #2e7d32;
            margin-bottom: 10px;
        }

        .result-subtext {
            font-size: 16px;
            color: #555;
        }

        .button-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 20px;
        }

        .btn {
            padding: 15px 40px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            display: none;
        }

        .back-button {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid white;
            color: white;
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .process-button {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
        }

        .process-button:hover {
            background: linear-gradient(135deg, #45a049 0%, #3d8b40 100%);
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.6);
        }

        .analyzing {
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .result {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="analysis-header">Análisis del Producto</div>
    
    <div class="image-container">
        <img id="capturedImage" alt="Foto capturada">
    </div>
    
    <div id="analysisContent"></div>
    
    <div class="button-container">
        <button class="btn process-button" id="processBtn">Procesar/Tratar Producto</button>
        <button class="btn back-button" id="backBtn">Volver a la Cámara</button>
    </div>

    <script>
        const capturedImage = document.getElementById('capturedImage');
        const analysisContent = document.getElementById('analysisContent');
        const backBtn = document.getElementById('backBtn');
        const processBtn = document.getElementById('processBtn');

        // Cargar la imagen desde localStorage
        window.addEventListener('load', () => {
            const imageData = localStorage.getItem('capturedImage');
            
            if (imageData) {
                capturedImage.src = imageData;
                
                // Mostrar mensaje de análisis
                analysisContent.innerHTML = `
                    <div class="result-container analyzing">
                        <div class="result-icon">⏳</div>
                        <div class="result-text">Iniciando análisis...</div>
                        <div class="result-subtext">Por favor espere</div>
                    </div>
                `;
                
                // Después de 2 segundos, mostrar el resultado
                setTimeout(() => {
                    analysisContent.innerHTML = `
                        <div class="result-container result">
                            <div class="result-icon">✅</div>
                            <div class="result-text">Este producto se encuentra apto para la venta</div>
                            <div class="result-subtext">Análisis completado exitosamente</div>
                        </div>
                    `;
                    backBtn.style.display = 'block';
                    processBtn.style.display = 'block';
                }, 2000);
            } else {
                // Si no hay imagen, redirigir a la página principal
                window.location.href = 'index.html';
            }
        });

        backBtn.addEventListener('click', () => {
            // Limpiar el localStorage
            localStorage.removeItem('capturedImage');
            // Volver a la página principal
            window.location.href = 'index.html';
        });

        processBtn.addEventListener('click', () => {
            // De momento no tiene función
            console.log('Botón Procesar/Tratar Producto presionado');
        });
    </script>
</body>
</html>
