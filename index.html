<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cámara Web</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }

        #video {
            width: 100%;
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
            display: none;
        }

        #video.active {
            display: block;
        }

        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 10;
        }

        button {
            padding: 15px 30px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        #captureBtn {
            background: rgba(76, 175, 80, 0.3);
            font-size: 18px;
        }

        #captureBtn:hover {
            background: rgba(76, 175, 80, 0.5);
        }

        .message {
            text-align: center;
            padding: 20px;
            font-size: 18px;
        }

        .error {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            padding: 20px;
            border-radius: 10px;
            max-width: 500px;
        }
    </style>
</head>
<body>
    <div id="message" class="message">
        <p>Presiona "Iniciar Cámara" para comenzar</p>
    </div>

    <video id="video" autoplay playsinline></video>
    
    <canvas id="canvas" style="display: none;"></canvas>

    <div class="controls">
        <button id="startBtn">Iniciar Cámara</button>
        <button id="switchBtn" style="display: none;">Cambiar Cámara</button>
        <button id="captureBtn" style="display: none;">📸 Capturar</button>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const startBtn = document.getElementById('startBtn');
        const switchBtn = document.getElementById('switchBtn');
        const captureBtn = document.getElementById('captureBtn');
        const message = document.getElementById('message');

        let stream = null;
        let currentFacingMode = 'user';

        async function startCamera(facingMode = 'user') {
            try {
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }

                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: facingMode
                    },
                    audio: false
                });

                video.srcObject = stream;
                video.classList.add('active');
                message.style.display = 'none';
                startBtn.textContent = 'Detener Cámara';
                captureBtn.style.display = 'block';
                
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(device => device.kind === 'videoinput');
                
                if (videoDevices.length > 1) {
                    switchBtn.style.display = 'block';
                }

            } catch (err) {
                console.error('Error al acceder a la cámara:', err);
                message.innerHTML = `<div class="error">
                    <p><strong>No se pudo acceder a la cámara</strong></p>
                    <p>Por favor, asegúrate de dar permisos a la cámara y que estés usando HTTPS o localhost.</p>
                </div>`;
                message.style.display = 'block';
            }
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                video.srcObject = null;
                video.classList.remove('active');
                stream = null;
                startBtn.textContent = 'Iniciar Cámara';
                switchBtn.style.display = 'none';
                captureBtn.style.display = 'none';
                message.innerHTML = '<p>Presiona "Iniciar Cámara" para comenzar</p>';
                message.style.display = 'block';
            }
        }

        function capturePhoto() {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const imageDataUrl = canvas.toDataURL('image/jpeg');
            
            // Guardar la imagen en localStorage para pasarla a la siguiente página
            localStorage.setItem('capturedImage', imageDataUrl);
            
            // Redirigir a la página de análisis
            window.location.href = 'analisisProducto.html';
        }

        startBtn.addEventListener('click', () => {
            if (stream) {
                stopCamera();
            } else {
                startCamera(currentFacingMode);
            }
        });

        switchBtn.addEventListener('click', () => {
            currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
            startCamera(currentFacingMode);
        });

        captureBtn.addEventListener('click', capturePhoto);
    </script>
</body>
</html>
