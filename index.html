<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analizador de Alimentos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .pantalla {
            display: none;
            flex-direction: column;
            min-height: 100vh;
        }

        .pantalla.activa {
            display: flex;
        }

        /* ========== PANTALLA 1: CÁMARA ========== */
        #pantalla-camara {
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #video {
            width: 100%;
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
            display: none;
        }

        #video.active {
            display: block;
        }

        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 10;
            flex-wrap: wrap;
            justify-content: center;
            padding: 0 20px;
        }

        button {
            padding: 15px 30px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        #captureBtn {
            background: rgba(76, 175, 80, 0.3);
            font-size: 18px;
        }

        #captureBtn:hover {
            background: rgba(76, 175, 80, 0.5);
        }

        .message {
            text-align: center;
            padding: 20px;
            font-size: 18px;
        }

        .error {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            padding: 20px;
            border-radius: 10px;
            max-width: 500px;
        }

        canvas {
            display: none;
        }

        /* ========== PANTALLA 2: ANÁLISIS ========== */
        #pantalla-analisis {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            padding: 20px;
            overflow-y: auto;
        }

        .analysis-header {
            text-align: center;
            padding: 20px 0;
            font-size: 28px;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .image-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #foto-capturada {
            max-width: 100%;
            max-height: 50vh;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 3px solid rgba(255, 255, 255, 0.3);
        }

        .result-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            margin: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .result-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .result-title {
            font-size: 24px;
            font-weight: 700;
            color: #2e7d32;
            margin-bottom: 15px;
        }

        .result-detail {
            font-size: 18px;
            color: #333;
            margin: 10px 0;
            padding: 10px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 10px;
        }

        .result-detail strong {
            color: #1e3c72;
        }

        .confidence {
            font-size: 14px;
            color: #666;
            margin-top: 15px;
            font-style: italic;
        }

        .analyzing {
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .result {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 20px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #45a049 0%, #3d8b40 100%);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.6);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid white;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 768px) {
            .analysis-header {
                font-size: 24px;
                padding: 15px 0;
            }

            .result-title {
                font-size: 20px;
            }

            .result-detail {
                font-size: 16px;
            }

            button {
                padding: 12px 20px;
                font-size: 14px;
            }

            .controls {
                bottom: 20px;
                gap: 10px;
            }

            .result-container {
                padding: 20px;
                margin: 15px;
            }
        }

        @media (max-width: 480px) {
            .analysis-header {
                font-size: 20px;
            }

            .result-title {
                font-size: 18px;
            }

            .result-icon {
                font-size: 50px;
            }

            button {
                padding: 10px 15px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <!-- PANTALLA 1: CÁMARA -->
    <div id="pantalla-camara" class="pantalla activa">
        <div id="message" class="message">
            <p>Presiona "Iniciar Cámara" para comenzar</p>
        </div>

        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>

        <div class="controls">
            <button id="startBtn">Iniciar Cámara</button>
            <button id="switchBtn" style="display: none;">Cambiar Cámara</button>
            <button id="captureBtn" style="display: none;">📸 Capturar</button>
        </div>
    </div>

    <!-- PANTALLA 2: ANÁLISIS -->
    <div id="pantalla-analisis" class="pantalla">
        <div class="analysis-header">Análisis del Producto</div>
        
        <div class="image-container">
            <img id="foto-capturada" alt="Foto capturada">
        </div>
        
        <div id="resultado-container"></div>
        
        <div class="button-group" id="botones-analisis"></div>
    </div>

    <script>
        // ========== CONFIGURACIÓN ==========
        const GEMINI_API_KEY = 'AIzaSyBMaIUwXwKVm28On1zuDWo4LepL56yU5Jw';
        const GEMINI_API_URL = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-pro:generateContent';

        // ========== VARIABLES GLOBALES ==========
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const startBtn = document.getElementById('startBtn');
        const switchBtn = document.getElementById('switchBtn');
        const captureBtn = document.getElementById('captureBtn');
        const message = document.getElementById('message');
        const fotoCapturada = document.getElementById('foto-capturada');

        let stream = null;
        let currentFacingMode = 'environment'; // Empezar con cámara trasera
        let imagenActual = null;
        let resultadoAnalisis = null;

        // ========== NAVEGACIÓN ENTRE PANTALLAS ==========
        function mostrarPantalla(nombre) {
            document.querySelectorAll('.pantalla').forEach(p => {
                p.classList.remove('activa');
            });
            document.getElementById(`pantalla-${nombre}`).classList.add('activa');
        }

        // ========== LÓGICA DE CÁMARA ==========
        async function startCamera(facingMode = 'environment') {
            try {
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }

                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: facingMode },
                    audio: false
                });

                video.srcObject = stream;
                video.classList.add('active');
                message.style.display = 'none';
                startBtn.textContent = 'Detener Cámara';
                captureBtn.style.display = 'block';
                
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(device => device.kind === 'videoinput');
                
                if (videoDevices.length > 1) {
                    switchBtn.style.display = 'block';
                }

            } catch (err) {
                console.error('Error al acceder a la cámara:', err);
                message.innerHTML = `<div class="error">
                    <p><strong>No se pudo acceder a la cámara</strong></p>
                    <p>Por favor, asegúrate de dar permisos a la cámara.</p>
                </div>`;
                message.style.display = 'block';
            }
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                video.srcObject = null;
                video.classList.remove('active');
                stream = null;
                startBtn.textContent = 'Iniciar Cámara';
                switchBtn.style.display = 'none';
                captureBtn.style.display = 'none';
                message.innerHTML = '<p>Presiona "Iniciar Cámara" para comenzar</p>';
                message.style.display = 'block';
            }
        }

        function capturePhoto() {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            imagenActual = canvas.toDataURL('image/jpeg');
            fotoCapturada.src = imagenActual;
            
            mostrarPantalla('analisis');
            analizarImagen();
        }

        // ========== ANÁLISIS CON GEMINI ==========
        async function analizarImagen() {
            const resultadoContainer = document.getElementById('resultado-container');
            const botonesAnalisis = document.getElementById('botones-analisis');
            
            botonesAnalisis.innerHTML = '';
            
            resultadoContainer.innerHTML = `
                <div class="result-container analyzing">
                    <div class="result-icon">⏳</div>
                    <div class="result-title">Analizando imagen...</div>
                    <div class="confidence">Por favor espere mientras procesamos la imagen</div>
                </div>
            `;

            try {
                const base64Image = imagenActual.split(',')[1];
                
                const response = await fetch(`${GEMINI_API_URL}?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                {
                                    text: `Analiza esta imagen de un producto alimenticio.

Determina:
1. ¿Es uno de estos productos?: Plátano, Tomate, Aguacate, Manzana, Lechuga
2. Estado de maduración:
   - "Maduración baja" (verde, inmaduro, no listo para consumir)
   - "Maduración avanzada" (maduro, listo para consumo, en su punto)
   - "Maduración muy avanzada" (sobremaduro, manchas oscuras, debe usarse hoy)

Responde ÚNICAMENTE en formato JSON exacto:
{
  "producto": "nombre exacto del producto",
  "estado": "Maduración baja" o "Maduración avanzada" o "Maduración muy avanzada",
  "confianza": número del 0 al 100,
  "razon": "breve explicación visual de por qué determinaste este estado"
}

Si no es ninguno de los 5 productos, responde:
{
  "producto": "Desconocido",
  "estado": null,
  "confianza": 0,
  "razon": "No es uno de los productos permitidos"
}`
                                },
                                {
                                    inline_data: {
                                        mime_type: "image/jpeg",
                                        data: base64Image
                                    }
                                }
                            ]
                        }]
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(JSON.stringify(errorData));
                }

                const data = await response.json();
                const textoRespuesta = data.candidates[0].content.parts[0].text;
                
                const jsonMatch = textoRespuesta.match(/\{[\s\S]*\}/);
                const resultado = JSON.parse(jsonMatch ? jsonMatch[0] : textoRespuesta);
                
                resultadoAnalisis = resultado;
                mostrarResultado(resultado);

            } catch (error) {
                console.error('Error en análisis:', error);
                
                let errorMessage = 'No se pudo analizar la imagen.';
                
                try {
                    const errorData = JSON.parse(error.message);
                    if (errorData.error && errorData.error.code === 429) {
                        errorMessage = 'Has excedido el límite de requests. Por favor, espera un momento e intenta nuevamente.';
                    }
                } catch (e) {
                    // Error genérico
                }
                
                resultadoContainer.innerHTML = `
                    <div class="result-container">
                        <div class="result-icon">❌</div>
                        <div class="result-title">Error en el análisis</div>
                        <div class="confidence">${errorMessage}</div>
                    </div>
                `;
                
                botonesAnalisis.innerHTML = `
                    <button class="btn-secondary" onclick="volverACamara()">Volver a Cámara</button>
                `;
            }
        }

        function mostrarResultado(resultado) {
            const resultadoContainer = document.getElementById('resultado-container');
            const botonesAnalisis = document.getElementById('botones-analisis');
            
            if (resultado.producto === "Desconocido") {
                resultadoContainer.innerHTML = `
                    <div class="result-container result">
                        <div class="result-icon">❓</div>
                        <div class="result-title">Producto no reconocido</div>
                        <div class="result-detail">${resultado.razon}</div>
                        <div class="confidence">Por favor, toma una foto de: Plátano, Tomate, Aguacate, Manzana o Lechuga</div>
                    </div>
                `;
                
                botonesAnalisis.innerHTML = `
                    <button class="btn-secondary" onclick="volverACamara()">Volver a Cámara</button>
                `;
                return;
            }
            
            resultadoContainer.innerHTML = `
                <div class="result-container result">
                    <div class="result-icon">✅</div>
                    <div class="result-title">${resultado.producto} detectado</div>
                    
                    <div class="result-detail">
                        <strong>Estado:</strong> ${resultado.estado}
                    </div>
                    
                    <div class="result-detail">
                        <strong>Análisis:</strong> ${resultado.razon}
                    </div>
                    
                    <div class="confidence">Confianza del análisis: ${resultado.confianza}%</div>
                </div>
            `;
            
            botonesAnalisis.innerHTML = `
                <button class="btn-secondary" onclick="volverACamara()">Volver a Cámara</button>
            `;
        }

        function volverACamara() {
            mostrarPantalla('camara');
        }

        // ========== EVENT LISTENERS ==========
        startBtn.addEventListener('click', () => {
            if (stream) {
                stopCamera();
            } else {
                startCamera(currentFacingMode);
            }
        });

        switchBtn.addEventListener('click', () => {
            currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
            startCamera(currentFacingMode);
        });

        captureBtn.addEventListener('click', capturePhoto);
    </script>
</body>
</html>
