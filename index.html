<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoMercado - Analizador de Alimentos</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/alertas.css">
</head>
<body>
    <!-- HEADER -->
    <header class="app-header">
        <div style="display: flex; align-items: center; gap: 12px; cursor: pointer;" onclick="window.location.href='/index.html'">
            <img src="assets/images/logo.png" alt="EcoMercado Logo" class="header-logo">
            <span class="header-text">Eco Mercado</span>
        </div>
        <div class="header-actions">
            <button class="btn-perfil" onclick="irAPerfil()" title="Mi Perfil">👤</button>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="app-main">
        <!-- PANTALLA 1: CÁMARA -->
        <div id="pantalla-camara" class="pantalla activa">
            <div id="message" class="message">
                <p>Presiona "Iniciar Cámara" para comenzar</p>
            </div>

            <video id="video" autoplay playsinline></video>
            <canvas id="canvas"></canvas>

            <div class="controls">
                <button id="startBtn">Iniciar Cámara</button>
                <button id="switchBtn" style="display: none;">Cambiar Cámara</button>
                <button id="captureBtn" style="display: none;">📸 Capturar</button>
            </div>
        </div>

        <!-- PANTALLA 2: ANÁLISIS -->
        <div id="pantalla-analisis" class="pantalla">
            <div class="analysis-header">Análisis del Producto</div>
            
            <div class="image-container">
                <img id="foto-capturada" alt="Foto capturada">
            </div>
            
            <div id="resultado-container"></div>
            
            <div id="guia-container" style="display: none;"></div>
            
            <div class="button-group" id="botones-analisis"></div>
        </div>
    </main>

    <!-- FOOTER TABS -->
    <footer class="tabs-footer">
        <div class="tab-spacer"></div>
        <a href="/index.html" class="tab active">
            <span class="tab-icon">📷</span>
            <span class="tab-label">Cámara</span>
        </a>
        <a href="/registro.html" class="tab">
            <span class="tab-icon">📋</span>
            <span class="tab-label">Registro</span>
        </a>
    </footer>

    <!-- Scripts -->
    <script src="assets/js/datos.js"></script>
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/navigation.js"></script>
    <script src="assets/js/alertas.js"></script>
    <script src="assets/js/camera.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/analisis.js"></script>
    
    <script>
        // Inicializar alertas al cargar la página
        document.addEventListener('DOMContentLoaded', function() {
            inicializarAlertas();
            actualizarBadgeTab();
        });
        
        // Función para navegar al perfil
        function irAPerfil() {
            window.location.href = 'perfil.html';
        }
    </script>
</body>
</html>
