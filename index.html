<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analizador de Alimentos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: white;
            min-height: 100vh;
        }

        .pantalla {
            display: none;
            flex-direction: column;
            min-height: 100vh;
        }

        .pantalla.activa {
            display: flex;
        }

        /* ========== PANTALLA 1: CÁMARA ========== */
        #pantalla-camara {
            justify-content: center;
            align-items: center;
        }

        #video {
            width: 100%;
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
            display: none;
        }

        #video.active {
            display: block;
        }

        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 10;
            flex-wrap: wrap;
            justify-content: center;
            padding: 0 20px;
        }

        button {
            padding: 15px 30px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        #captureBtn {
            background: rgba(76, 175, 80, 0.3);
            font-size: 18px;
        }

        #captureBtn:hover {
            background: rgba(76, 175, 80, 0.5);
        }

        .message {
            text-align: center;
            padding: 20px;
            font-size: 18px;
        }

        .error {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            padding: 20px;
            border-radius: 10px;
            max-width: 500px;
        }

        /* ========== PANTALLA 2: ANÁLISIS ========== */
        #pantalla-analisis {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            padding: 20px;
            overflow-y: auto;
        }

        .analysis-header {
            text-align: center;
            padding: 20px 0;
            font-size: 28px;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .image-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #foto-capturada {
            max-width: 100%;
            max-height: 50vh;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 3px solid rgba(255, 255, 255, 0.3);
        }

        .result-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            margin: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .result-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .result-title {
            font-size: 24px;
            font-weight: 700;
            color: #2e7d32;
            margin-bottom: 15px;
        }

        .result-detail {
            font-size: 18px;
            color: #333;
            margin: 10px 0;
            padding: 10px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 10px;
        }

        .result-detail strong {
            color: #1e3c72;
        }

        .confidence {
            font-size: 14px;
            color: #666;
            margin-top: 15px;
            font-style: italic;
        }

        .analyzing {
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .result {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 20px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #45a049 0%, #3d8b40 100%);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.6);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid white;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .btn-warning {
            background: linear-gradient(135deg, #FF9800 0%, #F57C00 100%);
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.4);
        }

        .btn-warning:hover {
            background: linear-gradient(135deg, #F57C00 0%, #E65100 100%);
            box-shadow: 0 6px 20px rgba(255, 152, 0, 0.6);
        }

        /* ========== PANTALLA DE GUÍA ========== */
        .guia-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            margin: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.5s ease-in;
        }

        .guia-title {
            font-size: 24px;
            font-weight: 700;
            color: #1e3c72;
            margin-bottom: 20px;
            text-align: center;
        }

        .guia-content {
            font-size: 16px;
            color: #333;
            line-height: 1.8;
            text-align: left;
            white-space: pre-line;
        }

        canvas {
            display: none;
        }
    </style>
</head>
<body>
    <!-- PANTALLA 1: CÁMARA -->
    <div id="pantalla-camara" class="pantalla activa">
        <div id="message" class="message">
            <p>Presiona "Iniciar Cámara" para comenzar</p>
        </div>

        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>

        <div class="controls">
            <button id="startBtn">Iniciar Cámara</button>
            <button id="switchBtn" style="display: none;">Cambiar Cámara</button>
            <button id="captureBtn" style="display: none;">📸 Capturar</button>
        </div>
    </div>

    <!-- PANTALLA 2: ANÁLISIS -->
    <div id="pantalla-analisis" class="pantalla">
        <div class="analysis-header">Análisis del Producto</div>
        
        <div class="image-container">
            <img id="foto-capturada" alt="Foto capturada">
        </div>
        
        <div id="resultado-container"></div>
        
        <div id="guia-section" style="display: none;"></div>
        
        <div class="button-group" id="botones-analisis"></div>
    </div>

    <script>
        // ========== DATOS DEL SISTEMA ==========
        const DIAS_PRODUCTO = {
            "Plátano": {
                "Maduración baja": 6,
                "Maduración avanzada": 2,
                "Maduración muy avanzada": 1
            },
            "Tomate": {
                "Maduración baja": 8,
                "Maduración avanzada": 4,
                "Maduración muy avanzada": 1
            },
            "Aguacate": {
                "Maduración baja": 6,
                "Maduración avanzada": 2,
                "Maduración muy avanzada": 1
            },
            "Manzana": {
                "Maduración baja": 18,
                "Maduración avanzada": 8,
                "Maduración muy avanzada": 4
            },
            "Lechuga": {
                "Maduración baja": 6,
                "Maduración avanzada": 3,
                "Maduración muy avanzada": 1
            }
        };

        const GUIAS = {
            "Plátano": {
                "Maduración baja": "El plátano aún no está listo para consumir. Espera unos días más hasta que la cáscara tome un color amarillo.\n\nRecomendaciones:\n• Guárdalo a temperatura ambiente\n• No lo refrigeres mientras esté verde\n• Espera entre 3-5 días para consumo óptimo",
                
                "Maduración avanzada": "¡Momento perfecto para consumir! El plátano está en su punto ideal.\n\nSi no lo usarás pronto, puedes:\n• Hacer pan de plátano casero\n• Congelarlo en rodajas para batidos\n• Preparar plátanos maduros fritos\n• Agregarlo a panqueques o avena\n• Hacer nice cream (helado saludable)",
                
                "Maduración muy avanzada": "Úsalo HOY. Está sobremaduro pero perfecto para recetas.\n\nIdeal para:\n• Pan de plátano (será más dulce)\n• Batido con leche y canela\n• Puré para panqueques o waffles\n• Muffins de plátano\n• Congelarlo para uso posterior"
            },
            "Tomate": {
                "Maduración baja": "El tomate aún está verde y no ha madurado completamente.\n\nRecomendaciones:\n• Déjalo madurar a temperatura ambiente\n• NO lo refrigeres (pierde sabor y textura)\n• Colócalo en una ventana con luz indirecta\n• Espera 3-5 días hasta que tome color rojo",
                
                "Maduración avanzada": "¡Momento ideal para ensaladas y consumo fresco!\n\nSi te sobra, puedes:\n• Preparar salsa de tomate casera\n• Hacer tomate frito para conservar\n• Preparar gazpacho o sopa fría\n• Tomates asados al horno\n• Bruschetta italiana",
                
                "Maduración muy avanzada": "Úsalo inmediatamente antes que se eche a perder.\n\nMejor para cocinar:\n• Salsa para pasta (concentra el sabor)\n• Tomate triturado en conserva\n• Sopa de tomate casera\n• Sofrito para guisos\n• Jugo de tomate"
            },
            "Aguacate": {
                "Maduración baja": "El aguacate está muy duro y necesita madurar.\n\nRecomendaciones:\n• Guárdalo a temperatura ambiente (3-5 días)\n• Para acelerar: mételo en bolsa de papel con manzana\n• NO lo refrigeres mientras esté duro\n• Sabrás que está listo cuando ceda ligeramente al presionar",
                
                "Maduración avanzada": "¡Perfecto! Momento ideal para consumir.\n\nPuedes preparar:\n• Guacamole clásico\n• Tostadas con aguacate\n• Ensaladas frescas\n• Smoothie verde\n• Relleno para tacos o burritos\n\nTip: Si solo usas la mitad, deja el hueso en la otra mitad y cúbrela con film transparente",
                
                "Maduración muy avanzada": "Úsalo HOY antes que se oxide completamente.\n\nOpciones:\n• Batido verde (licuado no se nota el color)\n• Crema de aguacate para pasta\n• Aderezo cremoso para ensaladas\n• Mascarilla facial hidratante (uso alternativo)\n• Congelarlo en puré con limón"
            },
            "Manzana": {
                "Maduración baja": "Manzana fresca y crujiente en su mejor momento.\n\nIdeal para:\n• Consumo fresco y natural\n• Ensaladas de frutas\n• Snack saludable\n• Rebanadas con mantequilla de maní\n• Ensaladas verdes\n\nTip: Guárdala en el refrigerador para que dure más tiempo",
                
                "Maduración avanzada": "Aún es comestible pero empieza a perder firmeza.\n\nConsidera preparar:\n• Compota de manzana casera\n• Jugo natural de manzana\n• Manzana horneada con canela\n• Pay o tarta de manzana\n• Puré de manzana para bebés",
                
                "Maduración muy avanzada": "Cocínala pronto o procésala.\n\nMejor para:\n• Puré de manzana (dulce natural)\n• Relleno para pasteles o crepas\n• Jugo fermentado (sidra casera)\n• Vinagre de manzana casero\n• Chips de manzana deshidratada"
            },
            "Lechuga": {
                "Maduración baja": "Lechuga fresca y crujiente, perfecta para ensaladas.\n\nIdeal para:\n• Ensalada verde clásica\n• Base para tacos o wraps\n• Acompañamiento de hamburguesas\n• Ensalada César\n• Rollitos frescos\n\nTip: Guárdala en el refrigerador envuelta en papel húmedo",
                
                "Maduración avanzada": "Consúmela hoy, está empezando a marchitarse.\n\nOpciones:\n• Ensalada verde (usar hojas más firmes)\n• Wraps vegetales\n• Batido verde detox\n• Salteada rápidamente\n• Sopa de verduras",
                
                "Maduración muy avanzada": "Última oportunidad de uso.\n\nSolo sirve para:\n• Batido verde (licuada no se nota la textura)\n• Sopa de verduras cocida\n• Caldo de vegetales\n• Compost (si está muy deteriorada)\n\nImportante: Descarta si tiene mal olor o moho"
            }
        };

        // ========== VARIABLES GLOBALES ==========
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const startBtn = document.getElementById('startBtn');
        const switchBtn = document.getElementById('switchBtn');
        const captureBtn = document.getElementById('captureBtn');
        const message = document.getElementById('message');
        const fotoCapturada = document.getElementById('foto-capturada');

        let stream = null;
        let currentFacingMode = 'user';
        let imagenActual = null;
        let resultadoAnalisis = null;

        // ========== NAVEGACIÓN ENTRE PANTALLAS ==========
        function mostrarPantalla(nombre) {
            document.querySelectorAll('.pantalla').forEach(p => {
                p.classList.remove('activa');
            });
            document.getElementById(`pantalla-${nombre}`).classList.add('activa');
        }

        // ========== LÓGICA DE CÁMARA ==========
        async function startCamera(facingMode = 'user') {
            try {
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }

                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: facingMode },
                    audio: false
                });

                video.srcObject = stream;
                video.classList.add('active');
                message.style.display = 'none';
                startBtn.textContent = 'Detener Cámara';
                captureBtn.style.display = 'block';
                
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(device => device.kind === 'videoinput');
                
                if (videoDevices.length > 1) {
                    switchBtn.style.display = 'block';
                }

            } catch (err) {
                console.error('Error al acceder a la cámara:', err);
                message.innerHTML = `<div class="error">
                    <p><strong>No se pudo acceder a la cámara</strong></p>
                    <p>Por favor, asegúrate de dar permisos a la cámara.</p>
                </div>`;
                message.style.display = 'block';
            }
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                video.srcObject = null;
                video.classList.remove('active');
                stream = null;
                startBtn.textContent = 'Iniciar Cámara';
                switchBtn.style.display = 'none';
                captureBtn.style.display = 'none';
                message.innerHTML = '<p>Presiona "Iniciar Cámara" para comenzar</p>';
                message.style.display = 'block';
            }
        }

        function capturePhoto() {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            imagenActual = canvas.toDataURL('image/jpeg');
            fotoCapturada.src = imagenActual;
            
            mostrarPantalla('analisis');
            analizarImagen();
        }

        // ========== ANÁLISIS CON CLAUDE API ==========
        async function analizarImagen() {
            const resultadoContainer = document.getElementById('resultado-container');
            const botonesAnalisis = document.getElementById('botones-analisis');
            const guiaSection = document.getElementById('guia-section');
            
            guiaSection.style.display = 'none';
            botonesAnalisis.innerHTML = '';
            
            resultadoContainer.innerHTML = `
                <div class="result-container analyzing">
                    <div class="result-icon">⏳</div>
                    <div class="result-title">Iniciando análisis...</div>
                    <div class="confidence">Por favor espere mientras analizamos la imagen</div>
                </div>
            `;

            try {
                const base64Image = imagenActual.split(',')[1];
                
                const response = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'anthropic-version': '2023-06-01'
                    },
                    body: JSON.stringify({
                        model: 'claude-3-5-sonnet-20241022',
                        max_tokens: 1024,
                        messages: [{
                            role: 'user',
                            content: [
                                {
                                    type: 'image',
                                    source: {
                                        type: 'base64',
                                        media_type: 'image/jpeg',
                                        data: base64Image
                                    }
                                },
                                {
                                    type: 'text',
                                    text: `Analiza esta imagen y determina:

1. ¿Es uno de estos productos?: Plátano, Tomate, Aguacate, Manzana o Lechuga
2. ¿En qué estado de maduración está?:
   - "Maduración baja" (verde, inmaduro, no listo para consumir)
   - "Maduración avanzada" (maduro, listo para consumo, en su punto)
   - "Maduración muy avanzada" (sobremaduro, manchas oscuras, muy blando)

Responde ÚNICAMENTE en formato JSON exacto, sin texto adicional:
{
  "producto": "nombre exacto del producto",
  "estado": "Maduración baja" o "Maduración avanzada" o "Maduración muy avanzada",
  "confianza": número del 0 al 100,
  "razon": "breve explicación visual de por qué determinaste este estado"
}

Si no es ninguno de los 5 productos listados, responde:
{
  "producto": "Desconocido",
  "estado": null,
  "confianza": 0,
  "razon": "No es uno de los productos permitidos (Plátano, Tomate, Aguacate, Manzana, Lechuga)"
}`
                                }
                            ]
                        }]
                    })
                });

                if (!response.ok) {
                    throw new Error(`Error en la API: ${response.status}`);
                }

                const data = await response.json();
                const textoRespuesta = data.content[0].text;
                
                const jsonMatch = textoRespuesta.match(/\{[\s\S]*\}/);
                const resultado = JSON.parse(jsonMatch ? jsonMatch[0] : textoRespuesta);
                
                resultadoAnalisis = resultado;
                mostrarResultado(resultado);

            } catch (error) {
                console.error('Error en análisis:', error);
                resultadoContainer.innerHTML = `
                    <div class="result-container">
                        <div class="result-icon">❌</div>
                        <div class="result-title">Error en el análisis</div>
                        <div class="confidence">No se pudo analizar la imagen. Por favor, intenta nuevamente.</div>
                    </div>
                `;
                
                botonesAnalisis.innerHTML = `
                    <button class="btn-secondary" onclick="volverACamara()">Volver a Cámara</button>
                `;
            }
        }

        function mostrarResultado(resultado) {
            const resultadoContainer = document.getElementById('resultado-container');
            const botonesAnalisis = document.getElementById('botones-analisis');
            
            if (resultado.producto === "Desconocido") {
                resultadoContainer.innerHTML = `
                    <div class="result-container result">
                        <div class="result-icon">❓</div>
                        <div class="result-title">Producto no reconocido</div>
                        <div class="result-detail">${resultado.razon}</div>
                        <div class="confidence">Por favor, toma una foto de: Plátano, Tomate, Aguacate, Manzana o Lechuga</div>
                    </div>
                `;
                
                botonesAnalisis.innerHTML = `
                    <button class="btn-secondary" onclick="volverACamara()">Volver a Cámara</button>
                `;
                return;
            }

            const diasRestantes = DIAS_PRODUCTO[resultado.producto][resultado.estado];
            
            resultadoContainer.innerHTML = `
                <div class="result-container result">
                    <div class="result-icon">✅</div>
                    <div class="result-title">${resultado.producto} detectado</div>
                    
                    <div class="result-detail">
                        <strong>Estado:</strong> ${resultado.estado}
                    </div>
                    
                    <div class="result-detail">
                        <strong>Días restantes estimados:</strong> ${diasRestantes} ${diasRestantes === 1 ? 'día' : 'días'}
                    </div>
                    
                    <div class="result-detail">
                        <strong>Análisis:</strong> ${resultado.razon}
                    </div>
                    
                    <div class="confidence">Confianza del análisis: ${resultado.confianza}%</div>
                </div>
            `;
            
            botonesAnalisis.innerHTML = `
                <button class="btn-primary" onclick="mostrarGuia()">Procesar/Tratar Producto</button>
                <button class="btn-warning" onclick="agregarAlRegistro()">Agregar Producto al Registro</button>
                <button class="btn-secondary" onclick="volverACamara()">Volver a Cámara</button>
            `;
        }

        function mostrarGuia() {
            const guiaSection = document.getElementById('guia-section');
            const botonesAnalisis = document.getElementById('botones-analisis');
            
            const guiaTexto = GUIAS[resultadoAnalisis.producto][resultadoAnalisis.estado];
            
            guiaSection.innerHTML = `
                <div class="guia-container">
                    <div class="guia-title">
                        Guía de Tratamiento: ${resultadoAnalisis.producto} - ${resultadoAnalisis.estado}
                    </div>
                    <div class="guia-content">${guiaTexto}</div>
                </div>
            `;
            guiaSection.style.display = 'block';
            
            botonesAnalisis.innerHTML = `
                <button class="btn-warning" onclick="agregarAlRegistro()">Agregar Producto al Registro</button>
                <button class="btn-secondary" onclick="ocultarGuia()">Volver al Resultado</button>
                <button class="btn-secondary" onclick="volverACamara()">Volver a Cámara</button>
            `;
        }

        function ocultarGuia() {
            const guiaSection = document.getElementById('guia-section');
            const botonesAnalisis = document.getElementById('botones-analisis');
            
            guiaSection.style.display = 'none';
            
            botonesAnalisis.innerHTML = `
                <button class="btn-primary" onclick="mostrarGuia()">Procesar/Tratar Producto</button>
                <button class="btn-warning" onclick="agregarAlRegistro()">Agregar Producto al Registro</button>
                <button class="btn-secondary" onclick="volverACamara()">Volver a Cámara</button>
            `;
        }

        function agregarAlRegistro() {
            // Por ahora no hace nada
            console.log('Agregar al registro:', resultadoAnalisis);
            alert('Función "Agregar al Registro" - Próximamente');
        }

        function volverACamara() {
            mostrarPantalla('camara');
            document.getElementById('guia-section').style.display = 'none';
        }

        // ========== EVENT LISTENERS ==========
        startBtn.addEventListener('click', () => {
            if (stream) {
                stopCamera();
            } else {
                startCamera(currentFacingMode);
            }
        });

        switchBtn.addEventListener('click', () => {
            currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
            startCamera(currentFacingMode);
        });

        captureBtn.addEventListener('click', capturePhoto);
    </script>
</body>
</html>
