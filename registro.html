<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoMercado - Registro</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/registro-styles.css">
</head>
<body>
    <!-- HEADER -->
    <header class="app-header">
        <!-- Vacío por ahora, para logo futuro -->
    </header>

    <!-- MAIN CONTENT -->
    <main class="app-main">
        <div class="registro-wrapper">
            <!-- Logo Header -->
            <div class="registro-header-logo">
                <div class="leaf-icon"></div>
                <div class="logo-text">ECO MERCADO</div>
            </div>
            
            <h1 class="registro-title-styled">Registro de Análisis</h1>

            <!-- Resumen -->
            <div class="summary-cards">
                <div class="summary-card-box green">
                    <div class="summary-number" id="count-aptos">0</div>
                    <div class="summary-label-small">Aptos<br>venta</div>
                </div>
                <div class="summary-card-box yellow">
                    <div class="summary-number" id="count-maduracion">0</div>
                    <div class="summary-label-small">Maduración<br>avanzada</div>
                </div>
                <div class="summary-card-box red">
                    <div class="summary-number" id="count-fuera">0</div>
                    <div class="summary-label-small">Fuera de<br>rango</div>
                </div>
            </div>
            
            <!-- Lista de productos -->
            <div class="productos-scroll" id="productos-lista">
                <!-- Generado por JavaScript -->
            </div>
            
            <!-- Empty state -->
            <div id="empty-state" class="empty-state-nuevo" style="display: none;">
                <div class="empty-icon-nuevo">📦</div>
                <p>No tienes productos registrados</p>
                <p class="empty-subtitle-nuevo">Analiza un producto para agregarlo aquí</p>
            </div>

            <!-- Botones de acción -->
            <div class="button-container-registro">
                <button class="action-btn-styled back-btn-styled" onclick="window.location.href='/index.html'">
                    <svg class="icon-svg" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd"/>
                    </svg>
                    Volver a Cámara
                </button>
            </div>
        </div>
    </main>

    <!-- FOOTER TABS -->
    <footer class="tabs-footer">
        <div class="tab-spacer"></div>
        <a href="/index.html" class="tab">
            <span class="tab-icon">📷</span>
            <span class="tab-label">Cámara</span>
        </a>
        <a href="/registro.html" class="tab active">
            <span class="tab-icon">📋</span>
            <span class="tab-label">Registro</span>
        </a>
    </footer>

    <!-- Scripts -->
    <script src="assets/js/datos.js"></script>
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/navigation.js"></script>
    <script src="assets/js/registro.js"></script>
</body>
</html>
