<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoMercado - Guía de Tratamiento</title>
    <link rel="stylesheet" href="assets/css/guia-styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="leaf-icon"></div>
            <div class="logo-text">ECO MERCADO</div>
        </div>
        
        <h1 class="title">Guía de Tratamiento</h1>
        <p class="subtitle">Estrategias comerciales profesionales</p>
        
        <div class="product-header">
            <div class="product-emoji" id="productEmoji">📦</div>
            <div class="product-name" id="productName">Cargando...</div>
            <span class="status-badge" id="statusBadge">
                ⏱️ Cargando estado...
            </span>
        </div>

        <div class="guide-content" id="guideContent">
            <p style="text-align: center; color: #64748b;">Cargando guía...</p>
        </div>

        <div class="tip-card">
            <div class="tip-title">
                💡 Consejo Eco
            </div>
            <p class="tip-text">
                Estas guías están diseñadas para comerciantes de mercado. Aplicar estas estrategias puede reducir pérdidas hasta en un 80% y aumentar tus ganancias.
            </p>
        </div>

        <div class="button-container">
            <button class="action-btn back-btn" onclick="volverARegistro()">
                <svg class="icon" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd"/>
                </svg>
                Volver al Registro
            </button>
        </div>
    </div>

    <script src="assets/js/datos.js"></script>
    <script src="assets/js/guia.js"></script>
</body>
</html>
