<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoMercado - Mis Intercambios</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/intercambios-styles.css">
</head>
<body>
    <!-- HEADER -->
    <header class="app-header">
        <div style="display: flex; align-items: center; gap: 12px; cursor: pointer;" onclick="window.location.href='index.html'">
            <img src="assets/images/logo.png" alt="EcoMercado Logo" class="header-logo">
            <span class="header-text">Eco Mercado</span>
        </div>
        <div class="header-actions">
            <button class="btn-perfil" onclick="irAPerfil()" title="Mi Perfil">👤</button>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="app-main">
        <div class="mis-intercambios-wrapper">
            <!-- Header -->
            <div class="mis-intercambios-header">
                <div class="header-icon">📦</div>
                <h1 class="mis-intercambios-title">Mis Intercambios</h1>
                <p class="mis-intercambios-subtitle">Selecciona los productos que deseas ofrecer</p>
            </div>

            <!-- Lista de productos -->
            <div class="productos-disponibles-lista" id="productos-disponibles">
                <!-- Generado dinámicamente por JS -->
            </div>

            <!-- Empty state -->
            <div id="empty-state-mis-intercambios" class="empty-state-intercambios" style="display: none;">
                <div class="empty-icon">📦</div>
                <p>No tienes productos registrados</p>
                <p class="empty-subtitle">Analiza productos desde la cámara para comenzar</p>
                <button class="btn-ir-camara" onclick="window.location.href='index.html'">
                    📷 Ir a Cámara
                </button>
            </div>

            <!-- Botones de acción -->
            <div class="mis-intercambios-buttons">
                <button class="btn-guardar-intercambios" onclick="guardarIntercambios()">
                    💾 Guardar Cambios
                </button>
                <button class="btn-volver-intercambios" onclick="window.location.href='intercambios.html'">
                    ← Volver
                </button>
            </div>
        </div>
    </main>

    <!-- FOOTER TABS -->
    <footer class="tabs-footer">
        <a href="intercambios.html" class="tab active">
            <span class="tab-icon">🔄</span>
            <span class="tab-label">Intercambios</span>
        </a>
        <a href="index.html" class="tab">
            <span class="tab-icon">📷</span>
            <span class="tab-label">Cámara</span>
        </a>
        <a href="registro.html" class="tab">
            <span class="tab-icon">📋</span>
            <span class="tab-label">Registro</span>
        </a>
    </footer>

    <!-- Scripts -->
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/mis-intercambios.js"></script>
    
    <script>
        function irAPerfil() {
            window.location.href = 'perfil.html';
        }
    </script>
</body>
</html>
