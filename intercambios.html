<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoMercado - Intercambios</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/intercambios-styles.css">
</head>
<body>
    <!-- HEADER -->
    <header class="app-header">
        <div style="display: flex; align-items: center; gap: 12px; cursor: pointer;" onclick="window.location.href='index.html'">
            <img src="assets/images/logo.png" alt="EcoMercado Logo" class="header-logo">
            <span class="header-text">Eco Mercado</span>
        </div>
        <div class="header-actions">
            <button class="btn-perfil" onclick="irAPerfil()" title="Mi Perfil">👤</button>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="app-main">
        <div class="intercambios-wrapper">
            <!-- Header -->
            <div class="intercambios-header">
                <div class="header-icon">🔄</div>
                <h1 class="intercambios-title">Intercambios Disponibles</h1>
                <p class="intercambios-subtitle">Encuentra productos cerca de ti</p>
            </div>

            <!-- Contenedor de contenido (cambia según estado) -->
            <div id="contenido-intercambios">
                <!-- Generado dinámicamente por JS -->
            </div>

            <!-- Botón Mis Intercambios (fijo abajo) -->
            <div class="btn-mis-intercambios-container">
                <button class="btn-mis-intercambios" onclick="irAMisIntercambios()">
                    📦 Mis Intercambios
                </button>
            </div>
        </div>
    </main>

    <!-- FOOTER TABS -->
    <footer class="tabs-footer">
        <a href="intercambios.html" class="tab active">
            <span class="tab-icon">🔄</span>
            <span class="tab-label">Intercambios</span>
        </a>
        <a href="index.html" class="tab">
            <span class="tab-icon">📷</span>
            <span class="tab-label">Cámara</span>
        </a>
        <a href="registro.html" class="tab">
            <span class="tab-icon">📋</span>
            <span class="tab-label">Registro</span>
        </a>
    </footer>

    <!-- Modal de detalles de usuario -->
    <div id="modal-usuario" class="modal-overlay-intercambio" style="display: none;">
        <!-- Generado dinámicamente por JS -->
    </div>

    <!-- Scripts -->
    <script src="assets/js/intercambios.js"></script>
    
    <script>
        function irAPerfil() {
            window.location.href = 'perfil.html';
        }
        
        function irAMisIntercambios() {
            window.location.href = 'mis-intercambios.html';
        }
    </script>
</body>
</html>
